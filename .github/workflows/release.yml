name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  MODULE: github.com/dreamstation625/FrpFireWall

jobs:
  prepare:
    name: 发布校验
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      publish: ${{ steps.gate.outputs.publish }}
      built_at: ${{ steps.ver.outputs.built_at }}
    steps:
      - uses: actions/checkout@v4
      - name: 校验 tag 与 VERSION
        id: ver
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d ' \t\r\n' < VERSION)"
          if [ "$version" != "$file_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 VERSION $file_version 不一致"
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-pre\.[0-9]{2,})?$ ]]; then
            echo "::error::非法版本号：$version"
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-pre.* ]]; then prerelease=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 检查版本是否提升
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 200 --json tagName --jq '.[].tagName' > /tmp/released.txt
          go run ./tools/versioncmp -candidate "$GITHUB_REF_NAME" -existing /tmp/released.txt > /tmp/gate.txt
          cat /tmp/gate.txt
          cat /tmp/gate.txt >> "$GITHUB_OUTPUT"
          cat /tmp/gate.txt >> "$GITHUB_STEP_SUMMARY"
          if ! grep -qx 'publish=true' /tmp/gate.txt; then
            echo '::notice::版本未提升，后续构建和发布任务全部跳过'
          fi

  checks:
    name: 后端检查
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./... -count=1

  frontend:
    name: 前端构建
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: test -s internal/web/dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: internal/web/dist/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Linux ${{ matrix.arch }}
    needs: [prepare, checks, frontend]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: release-web
          path: internal/web/dist/
      - name: 编译与验证
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILT_AT: ${{ needs.prepare.outputs.built_at }}
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          test -s internal/web/dist/index.html
          mkdir -p dist
          ldflags="-s -w -X ${MODULE}/internal/version.Version=${VERSION} -X ${MODULE}/internal/version.Commit=$(git rev-parse --short HEAD) -X ${MODULE}/internal/version.BuildTime=${BUILT_AT}"
          go build -trimpath -ldflags "$ldflags" -o "dist/frpfirewall-linux-${GOARCH}" ./cmd/frpfirewall
          if [ "$GOARCH" = amd64 ]; then
            out="$(./dist/frpfirewall-linux-amd64 -version)"
            echo "$out"
            [[ "$out" == "FrpFireWall ${VERSION} "* ]]
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/frpfirewall-linux-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: 发布 Release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-linux-*
          path: dist/
          merge-multiple: true
      - name: 收集附件与校验和
        run: |
          set -euo pipefail
          test -s dist/frpfirewall-linux-amd64
          test -s dist/frpfirewall-linux-arm64
          cp scripts/install.sh scripts/frpfirewall-panic.sh deploy/frpfirewall.service dist/
          chmod 0755 dist/frpfirewall-linux-* dist/*.sh
          bash -n dist/install.sh
          bash -n dist/frpfirewall-panic.sh
          cd dist
          sha256sum frpfirewall-linux-amd64 frpfirewall-linux-arm64 frpfirewall-panic.sh frpfirewall.service install.sh > sha256sums.txt
          sha256sum -c sha256sums.txt
      - name: 生成发布说明
        run: bash scripts/release-notes.sh "$GITHUB_REF_NAME" > /tmp/notes.md
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=("v${VERSION}" --title "v${VERSION}" --notes-file /tmp/notes.md --verify-tag)
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          gh release create "${args[@]}" dist/frpfirewall-linux-amd64 dist/frpfirewall-linux-arm64 dist/install.sh dist/frpfirewall-panic.sh dist/frpfirewall.service dist/sha256sums.txt
