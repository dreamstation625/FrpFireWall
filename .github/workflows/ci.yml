name: CI

# 日常提交的守门人：静态检查、单元测试，以及发版时的完整构建。
# 发布流程在 release.yml，由 tag 触发。
#
# 分两档跑，避免每次提交都等一遍完整构建：
#
#   日常提交 —— go vet + 单元测试。几十秒出结果，挡的是「编译器看不见」的那类
#               问题：改了 JSON tag 而按字符串 key 取值的引用点没跟着改、
#               往 ip 家族的链里写 ip6 表达式之类。
#   完整检查 —— VERSION 或工作流有变化时，追加前端构建、脚本回归与编译。
#               脚本改动也独立触发回归，避免只改脚本时漏测。
#
# 前端构建是唯一的例外：它额外跟随 web/ 目录。前端产物只在改前端时会变，
# 没必要等到发版才验一遍 —— 那会让前端错误一直积压到发版当天。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 后面几个 job 跑哪些步骤取决于变更范围，所以先单独算出来。
  # 判断逻辑集中在这里而不是分散到各 job，是为了只有一份、不会两边漂移。
  changes:
    name: 变更范围
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.detect.outputs.version_changed }}
      web_changed: ${{ steps.detect.outputs.web_changed }}
      full_check: ${{ steps.detect.outputs.full_check }}
      scripts_changed: ${{ steps.detect.outputs.scripts_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 要和基准提交做 diff，浅克隆拿不到它
          fetch-depth: 0

      - name: 检测变更范围
        id: detect
        env:
          # push 用事件里的 before；PR 没有 before，退到 base。
          # workflow_dispatch 两者都空，走下面的兜底分支。
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # 拿不到可靠基准时（首次推送、强制推送、手动触发）按「都变了」处理：
          # 多跑一遍只是慢几十秒，漏跑则会让没人构建过的提交悄悄进 main。
          if [ -z "$BASE_SHA" ] \
             || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            version_changed=true
            web_changed=true
            full_check=true
            scripts_changed=true
            note="拿不到比较基准，按全部变更处理"
          else
            files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            echo "变更文件："
            echo "${files:-（无）}"

            version_changed=false
            web_changed=false
            if grep -qx VERSION <<<"$files"; then version_changed=true; fi
            if grep -q '^web/' <<<"$files"; then web_changed=true; fi
            full_check="$version_changed"
            scripts_changed=false
            if grep -q '^\.github/workflows/' <<<"$files"; then full_check=true; fi
            if grep -Eq '^(scripts/|testdata/test-.*\.sh$)' <<<"$files"; then scripts_changed=true; fi
            note="基准 ${BASE_SHA:0:7}"
          fi

          echo "version_changed=$version_changed" >> "$GITHUB_OUTPUT"
          echo "web_changed=$web_changed" >> "$GITHUB_OUTPUT"
          echo "full_check=$full_check" >> "$GITHUB_OUTPUT"
          echo "scripts_changed=$scripts_changed" >> "$GITHUB_OUTPUT"

          {
            echo "### 变更范围"
            echo
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| VERSION 变更 | \`$version_changed\` |"
            echo "| 前端变更 | \`$web_changed\` |"
            echo "| 完整检查 | \`$full_check\` |"
            echo "| 脚本变更 | \`$scripts_changed\` |"
            echo "| 说明 | $note |"
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: 后端
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本号格式非法会让 Release 工作流在同一个位置失败，而且失败前不产出
      # 任何资产。校验本身是毫秒级的，所以日常提交也跑。
      - name: 校验 VERSION 文件格式
        run: |
          set -euo pipefail
          v="$(tr -d ' \t\r\n' < VERSION)"
          echo "VERSION = $v"

          # 开发机上出现过的旧格式，先单独拦一道给清晰提示。
          # 注意必须在下面的通用正则之前判断——否则会被正则先拒掉，
          # 这段永远执行不到。
          case "$v" in
            *-dev|*-rc*|*-alpha*|*-beta*)
              echo "::error title=版本号后缀不被支持::不支持 -dev / -rc / -alpha / -beta 后缀，预发布一律写成 -pre.NN（如 0.0.1-pre.01）。当前为「$v」"
              exit 1
              ;;
          esac

          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-pre\.[0-9]{2,})?$'; then
            echo "::error title=版本号格式非法::VERSION 必须是 0.0.1 或 0.0.1-pre.01 形态，当前为「$v」"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 检查 go.mod 是否整洁
        run: |
          set -euo pipefail
          cp go.mod /tmp/go.mod.before
          cp go.sum /tmp/go.sum.before
          go mod tidy
          if ! diff -q /tmp/go.mod.before go.mod >/dev/null \
             || ! diff -q /tmp/go.sum.before go.sum >/dev/null; then
            echo "::error title=go.mod 需要整理::运行 go mod tidy 后有改动，请本地执行并提交。"
            diff -u /tmp/go.mod.before go.mod || true
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # internal/firewall 的用例锁死"生成的 nft 脚本长什么样"：桩命令不解析
      # 语法、只会点头，而像"往 ip 家族的链里写 ip6 表达式"这种错，nft 会拒绝
      # 整份脚本（真实故障：预检失败 → 那条链上一个规则都没下发，IPv4 封禁跟着
      # 一起失效）。规则文本层面的错误只能靠断言脚本文本来防。
      #
      # 这一步（连同上面的 vet）是日常提交唯一跑的东西，所以它不能慢：
      # 它挡住的正是本次改动引入的那类错，等发版才发现代价太大。
      - name: 单元测试
        run: go test ./... -count=1

      # 脚本回归随版本、工作流和脚本改动运行，额外编译随完整检查运行。

      # 一键脚本是用户装机的第一道门，它自己的回归必须固化下来。
      # 覆盖：版本比较与 Go 侧（internal/version）逐条一致、
      #       起假 Release 服务跑完整的 安装 → 升级 → 回滚 → 卸载 流程、
      #       校验和不匹配必须中止、降级拦截、--purge 护栏。
      # 全程用桩命令，不碰真实的 systemd / iptables / /usr/local。
      - name: 安装脚本测试
        if: needs.changes.outputs.full_check == 'true' || needs.changes.outputs.scripts_changed == 'true'
        run: bash testdata/test-install.sh

      # 版本号散落在四处（VERSION / version.go / package.json / package-lock.json），
      # 漏改一处不会编译失败，只会让 internal/version 的对账用例挂掉 —— 而
      # Release 工作流在同一个位置失败，失败前不产出任何资产。手动改过两次
      # 两次都漏，所以把 "四处都改到了" 固化下来。
      - name: 版本脚本测试
        if: needs.changes.outputs.full_check == 'true' || needs.changes.outputs.scripts_changed == 'true'
        run: bash testdata/test-version-bump.sh

      - name: 发布说明测试
        if: needs.changes.outputs.full_check == 'true' || needs.changes.outputs.scripts_changed == 'true'
        run: bash testdata/test-release-notes.sh

      - name: 编译
        if: needs.changes.outputs.full_check == 'true'
        run: CGO_ENABLED=0 go build -trimpath ./...

  frontend:
    name: 前端
    needs: changes
    # 发版要打包前端产物，改了前端代码也得验一遍；两条都不满足就没必要跑。
    if: needs.changes.outputs.full_check == 'true' || needs.changes.outputs.web_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 平台专用的二进制包（esbuild / rollup / swc 等）只能作为传递的 optional
      # 依赖存在。一旦被显式写进 dependencies，在别的平台上 npm ci 会直接
      # EBADPLATFORM 失败 —— 而且报错只出现在 CI 上，本地（写它的那个平台）
      # 永远复现不了。
      - name: 检查是否显式声明了平台专用包
        working-directory: web
        run: |
          node -e '
            const pkg = require("./package.json");
            const all = { ...(pkg.dependencies || {}), ...(pkg.devDependencies || {}) };
            const bad = Object.keys(all).filter(
              (n) =>
                /^@(esbuild|rollup|swc|parcel|biome)\//.test(n) ||
                /-(win32|linux|darwin|freebsd|android|openbsd)-/.test(n)
            );
            if (bad.length) {
              console.error("检测到平台专用的显式依赖：" + bad.join(", "));
              console.error("它们应作为 esbuild/rollup 的 optional 传递依赖存在，不应显式声明。");
              process.exit(1);
            }
            console.log("未发现平台专用的显式依赖");
          '

      # 用 ci 而不是 install：lockfile 与 package.json 不一致时直接失败，
      # 避免依赖在 CI 上被静默升级。
      - name: 安装依赖
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: 构建
        working-directory: web
        run: npm run build

      - name: 确认产物已生成
        run: |
          set -euo pipefail
          test -f internal/web/dist/index.html
          echo "产物大小: $(du -sh internal/web/dist | cut -f1)"
          echo "chunk 清单:"
          ls -1 internal/web/dist/assets/ | head -30
